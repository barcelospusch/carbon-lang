name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  check:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --all-targets
  integration:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/mermaid/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Install Tectonic
        shell: pwsh
        run: ./scripts/install-tectonic.ps1
      - name: Install Mermaid and Chromium
        shell: pwsh
        run: ./scripts/install-mermaid.ps1
      # Cold Tectonic caches are shared across processes; initialize formats
      # sequentially to avoid competing texput.fmt writes on Windows.
      - name: Integration tests (serial runtime initialization)
        run: cargo test --locked -- --include-ignored --test-threads=1
        env:
          RUST_BACKTRACE: '1'
      - run: cargo build --release --locked
      - run: python scripts/check-examples.py --binary target/release/carbon.exe
      - uses: actions/upload-artifact@v4
        with:
          name: example-pdfs
          path: output/examples/**/*.pdf
          if-no-files-found: error
